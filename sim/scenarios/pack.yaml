# Scenario pack (SCN-01). Bump `version` on every tuning change (REL-01): results record it.
version: "1.0.0"

# The baseline world every scenario shares (TDD §7.1, §8.7).
world:
  baseline_s: 600  # at least this much baseline before any onset (CTL-05)
  traffic:
    rates: {read: 30, receipt_export: 2, order: 10}  # per second
    amplitude: 0.10  # sine, 120 s period
    noise: 0.05  # per-second uniform noise
  ledger:
    pool_size: 10
    hold_mean_ms: {read: 80, write: 120, receipt_export: 300}
  worker:
    restart_backoff_ms: 5000
  retry_policy: {api: backoff, worker: backoff}
  flags: {receipt_export: true, checkout_banner: true}

# Recent-changes decoys shared by every scenario (TDD §9.4, SCN-07). Short, factual, never a cause.
decoy_changes:
  - text: checkout_banner enabled
  - text: Dashboard theme updated
  - text: api v2.3 deployed
    yesterday: true
  - text: ledger backup completed

# Controller-side defaults (§8.7, §9.6, §10, §11.2), carried in the pack so tuning is data.
controller:
  alerts: {api_error_rate_pct: 5, api_latency_p95_ms: 1000, orders_backlog: 500, for_s: 30}
  stability_window_s: 60
  round_time_limit_s: 720
  budget: 12
  action_costs: {restart_service: 3, restart_all: 10, recycle_pool: 1, set_feature_flag: 1,
                 set_retry_policy: 1, quarantine_head_message: 1, purge_queue: 4}
  score:
    speed_max: 300
    speed_grace_s: 90
    impact_max: 300
    impact_scale: 15000
    hold_declared: 100
    hold_neutralized: 100
    budget_max: 200
    breadth_restart_all: 150
    breadth_restart_service: 25
    noeffect: 30
    premature: 50
    premature_max_count: 3
  feed: {interval_s: 5, min_count: 5}
