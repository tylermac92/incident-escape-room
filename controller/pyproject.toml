[project]
name = "escape-controller"
version = "0.1.0"
description = "Incident Escape Room game controller."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "websockets", "escape-isolation"]

[dependency-groups]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "controller"

[tool.uv.sources]
escape-isolation = { path = "../isolation" }
