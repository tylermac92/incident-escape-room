# The whole nginx config for the ui container (ENV-05). It replaces the image's default.
# Policy (TDD §5.1, T-ISO-4): one upstream, no resolver, no variable proxy targets.
# check.sh enforces this in `make test` and in the image build.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # The root filesystem is read-only; compose mounts a tmpfs on /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Resolved once at startup; there is deliberately no resolver.
    upstream controller {
        server controller:8000;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Set here only: an add_header inside a location would drop this one.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;

        # A stopped controller leaves nginx connecting to its old address until timeout.
        # Fail fast, and report a timeout as 502 too, so the UI sees one status (UI-15).
        proxy_connect_timeout 2s;
        error_page 504 = @controller_unavailable;
        location @controller_unavailable {
            return 502;
        }

        location /api/ {
            proxy_pass http://controller;
            proxy_http_version 1.1;
        }

        location ~ ^/api/rounds/[^/]+/stream$ {
            proxy_pass http://controller;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }
}
